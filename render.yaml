      - key: INTERNAL_SERVICE_SECRET
        sync: false

  # ─────────────────────────────────────────────────────────────────
  # Notification Service
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: micro-arc-notification
    runtime: docker
    rootDir: services/notification-service
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NOTIFICATION_SERVICE_PORT
        value: "3008"
      - key: DATABASE_URL
        sync:  postgresql://neondb_owner:npg_dW2aB9uklnys@ep-misty-thunder-admy4rdm-pooler.c-2.us-east-1.aws.neon.tech/notification_db?sslmode=require          # paste NOTIFICATION_DATABASE_URL from your .env
      - key: INTERNAL_SERVICE_SECRET
