      - key: DATABASE_URL
        sync: postgresql://neondb_owner:npg_dW2aB9uklnys@ep-misty-thunder-admy4rdm-pooler.c-2.us-east-1.aws.neon.tech/verification_db?sslmode=require          # paste VERIFICATION_DATABASE_URL from your .env
      - key: INTERNAL_SERVICE_SECRET
